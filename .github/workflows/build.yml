name: Build VIAL Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vial-QMK
        uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          ref: vial
          submodules: recursive
          path: vial-qmk

      - name: Checkout Your Config
        uses: actions/checkout@v4
        with:
          path: local_repo

      - name: Locate and Inject Files
        run: |
          TARGET_DIR="vial-qmk/keyboards/rp2040_macropad"
          mkdir -p "$TARGET_DIR/keymaps/vial"

          cp $(find local_repo -name "rules.mk" | head -n 1) "$TARGET_DIR/"
          cp $(find local_repo -name "config.h" | head -n 1) "$TARGET_DIR/"
          cp $(find local_repo -name "info.json" | head -n 1) "$TARGET_DIR/"
          cp $(find local_repo -name "vial.json" | head -n 1) "$TARGET_DIR/"
          cp $(find local_repo -name "keymap.c" | head -n 1) "$TARGET_DIR/keymaps/vial/"

          echo "Injected files into $TARGET_DIR:"
          ls -la "$TARGET_DIR"

      - name: Install Toolchain
        run: |
          python3 -m pip install --user qmk

      - name: Compile UF2
        run: |
          cd vial-qmk
          make rp2040_macropad:vial

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rp2040_macropad_firmware
          path: vial-qmk/.build/*.uf2
