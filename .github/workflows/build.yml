name: Build VIAL Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vial-QMK
        uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          submodules: recursive

      - name: Checkout Your Config
        uses: actions/checkout@v4
        with:
          path: local_repo

      - name: Copy Keyboard Configuration
        run: |
          cp -r local_repo/keyboards/rp2040_macropad keyboards/

      - name: Install Toolchain
        run: |
          python3 -m pip install --user qmk
          qmk setup -y vial-kb/vial-qmk

      - name: Compile UF2
        run: |
          make rp2040_macropad:vial

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rp2040_macropad_firmware
          path: .build/*.uf2
